name: turtlebot-aster-egress

services:
  wireguard:
    # Multi-architecture digest resolved 2026-09-17.
    image: lscr.io/linuxserver/wireguard:latest@sha256:dca67384e3e9a5bcc288461fa983e6fcb0e248e5a2d8e5b3e5d3f753bfac3e35
    container_name: turtlebot-aster-wireguard
    cap_add:
      - NET_ADMIN
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
    volumes:
      - ./config:/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wg show wg0 >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  aster-probe:
    # Multi-architecture digest resolved 2026-09-17.
    image: curlimages/curl:8.12.1@sha256:94e9e444bcba979c2ea12e27ae39bee4cd10bc7041a472c4727a558e213744e6
    container_name: turtlebot-aster-probe
    # Only this service (and the future Aster executor) uses the tunnel. The
    # TurtleBot web app, ApeX broker, and ApeX signer keep their current route.
    network_mode: service:wireguard
    depends_on:
      wireguard:
        condition: service_healthy
    environment:
      ASTER_JURISDICTION_APPROVED: ${ASTER_JURISDICTION_APPROVED:-false}
      ASTER_API_BASE_URL: ${ASTER_API_BASE_URL:-https://fapi.asterdex.com}
      ASTER_PROBE_INTERVAL_SECONDS: ${ASTER_PROBE_INTERVAL_SECONDS:-30}
      ASTER_PROBE_TIMEOUT_SECONDS: ${ASTER_PROBE_TIMEOUT_SECONDS:-10}
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./probe.sh:/opt/turtlebot/probe.sh:ro
      - ./state:/opt/turtlebot/state
    entrypoint: ["/bin/sh", "/opt/turtlebot/probe.sh", "--loop"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/turtlebot/state/healthy && test $$(($$(date +%s) - $$(cat /opt/turtlebot/state/healthy))) -lt 90"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

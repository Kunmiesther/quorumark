name: SynFutures smart-account contracts

on:
  pull_request:
    paths:
      - 'contracts/synfutures/**'
      - 'src/lib/exchanges/synfutures/module-artifact.json'
      - 'scripts/check-synfutures-artifact.mjs'
      - '.github/workflows/synfutures-contracts-ci.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/synfutures/**'
      - 'src/lib/exchanges/synfutures/module-artifact.json'
      - 'scripts/check-synfutures-artifact.mjs'
      - '.github/workflows/synfutures-contracts-ci.yml'
  workflow_dispatch:
    inputs:
      run_base_fork:
        description: 'Run read-only RPC / local-EVM Base integration test'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts/synfutures
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/synfutures/package-lock.json
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4
          cache: false
      - name: Install pinned Safe test artifacts only
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check formatting
        run: forge fmt --check
      - name: Test permission boundaries and real Safe integration
        run: forge test -vv
      - name: Verify pinned app deployment artifact against compiler output
        run: node ../../scripts/check-synfutures-artifact.mjs
      - name: Test Base fork lifecycle (never broadcasts)
        if: github.event_name == 'workflow_dispatch' && inputs.run_base_fork
        env:
          RUN_SYNFUTURES_FORK: 'true'
          BASE_FORK_RPC_URL: https://mainnet.base.org
        run: forge test --match-test testBaseForkRealSafeDepositOpenReduceClose -vv

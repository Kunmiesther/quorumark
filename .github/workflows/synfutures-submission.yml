name: SynFutures submission verification
on:
  pull_request:
    paths:
      - 'signer/app/synfutures_*.py'
      - 'signer/tests/test_synfutures_*.py'
      - '.github/workflows/synfutures-submission.yml'
  push:
    branches: [main]
    paths:
      - 'signer/app/synfutures_*.py'
      - 'signer/tests/test_synfutures_*.py'
      - '.github/workflows/synfutures-submission.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1 eth-account==0.14.0 eth-utils==6.0.0 requests==2.34.2
      - run: python -m pytest signer/tests/test_synfutures_submission.py signer/tests/test_synfutures_reconciliation.py signer/tests/test_synfutures_positions.py signer/tests/test_synfutures_account_adapter.py signer/tests/test_synfutures_entry.py signer/tests/test_synfutures_campaign.py signer/tests/test_synfutures_owner_receipt.py signer/tests/test_synfutures_settlement.py signer/tests/test_synfutures_execution.py -q

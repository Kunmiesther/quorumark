name: Aster lifecycle verification
on:
  push:
    paths: ['supabase/**', 'scripts/test-*.mjs', '.github/workflows/aster-lifecycle-ci.yml']
  pull_request:
    paths: ['supabase/**', 'scripts/test-*.mjs', '.github/workflows/aster-lifecycle-ci.yml']
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/aster-ledger-ci --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.3.14
      - run: node scripts/test-execution-ledgers.mjs /tmp/aster-ledger-ci/node_modules/@electric-sql/pglite/dist/index.js
      - run: node scripts/test-closed-position-pnl.mjs /tmp/aster-ledger-ci/node_modules/@electric-sql/pglite/dist/index.js
      - run: node scripts/test-apex-order-recovery.mjs /tmp/aster-ledger-ci/node_modules/@electric-sql/pglite/dist/index.js
      - run: node scripts/test-apex-reported-pnl.mjs /tmp/aster-ledger-ci/node_modules/@electric-sql/pglite/dist/index.js
      - run: node scripts/test-autopilot-isolation.mjs /tmp/aster-ledger-ci/node_modules/@electric-sql/pglite/dist/index.js
      - run: node scripts/test-six-paper-wallets.mjs /tmp/aster-ledger-ci/node_modules/@electric-sql/pglite/dist/index.js
      - run: node scripts/test-synfutures-setup.mjs /tmp/aster-ledger-ci/node_modules/@electric-sql/pglite/dist/index.js
      - run: node scripts/test-synfutures-journal.mjs /tmp/aster-ledger-ci/node_modules/@electric-sql/pglite/dist/index.js
  edge-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.0
      - run: deno check --no-config supabase/functions/worker-ingest/index.ts supabase/functions/reconcile-live-positions/index.ts supabase/functions/ingest-live-fills/index.ts supabase/functions/autopilot-plan/index.ts

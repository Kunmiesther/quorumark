name: Test and Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install broker dependencies for integrated regression tests
        run: npm ci --prefix broker --no-audit --no-fund
      - name: Typecheck broker
        run: npm run typecheck --prefix broker
      - name: Typecheck application
        run: npx tsc --noEmit --pretty false
      - name: Test native SynFutures database admission
        run: node scripts/test-synfutures-admission.mjs
      - name: Test native SynFutures lifecycle
        run: node scripts/test-synfutures-lifecycle.mjs
      - name: Test owner SynFutures activation
        run: node scripts/test-synfutures-activation.mjs
      - name: Test leverage ceiling path
        run: npm test -- src/lib/universe/__tests__/leverage.test.ts
      - name: Run full regression suite
        run: npm test -- --maxWorkers=1 --reporter=verbose
      - name: Build application
        if: always()
        run: npm run build

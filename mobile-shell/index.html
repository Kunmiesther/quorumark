<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070b" />
    <title>Turtle Bot</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 18%, #173329, #05070b 58%); color: #f4fff9; }
      main { width: min(82vw, 27rem); padding: 2rem; text-align: center; border: 1px solid rgba(129, 255, 204, .13); border-radius: 2rem; background: linear-gradient(145deg, #101a18, #070b0c); box-shadow: 18px 18px 38px #020304, -10px -10px 30px rgba(42, 86, 70, .22), inset 1px 1px 1px rgba(255,255,255,.08); }
      img { width: 7rem; height: 7rem; object-fit: contain; border-radius: 50%; }
      h1 { margin: 1rem 0 .5rem; font-size: 1.75rem; }
      p { margin: 0; color: #9fb5aa; line-height: 1.5; }
      button { width: 100%; min-height: 3.25rem; margin-top: 1.5rem; border: 1px solid rgba(129,255,204,.18); border-radius: 1rem; background: #101916; box-shadow: 8px 8px 18px #020403, -5px -5px 14px rgba(48,91,75,.2); color: #d9ffed; font: inherit; font-weight: 700; cursor: pointer; }
      button:active { box-shadow: inset 5px 5px 12px #020403, inset -3px -3px 10px rgba(48,91,75,.18); transform: translateY(1px); }
      small { display: block; min-height: 1.2rem; margin-top: .8rem; color: #6f8c7e; }
    </style>
  </head>
  <body>
    <main>
      <img src="turtlebot-app-icon-1024.png" alt="Turtle Bot" />
      <h1>Turtle Bot</h1>
      <p>Turtle Bot needs an internet connection for live prices and secure trading. Your funds remain in your connected account.</p>
      <button id="retry" type="button">Try again</button>
      <small id="status" role="status">Checking your connection…</small>
    </main>
    <script>
      const appUrl = "https://www.turtlebot.app";
      const status = document.getElementById("status");
      const retry = () => {
        status.textContent = navigator.onLine ? "Reconnecting…" : "You are offline";
        if (navigator.onLine) window.location.replace(appUrl);
      };
      document.getElementById("retry").addEventListener("click", retry);
      window.addEventListener("online", retry);
      window.addEventListener("offline", () => { status.textContent = "You are offline"; });
      status.textContent = navigator.onLine ? "Service temporarily unavailable" : "You are offline";
    </script>
  </body>
</html>

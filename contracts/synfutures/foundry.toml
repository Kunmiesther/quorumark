[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Test-only npm artifacts must not change production metadata / CREATE2 addresses.
auto_detect_remappings = false
remappings = []
fs_permissions = [{ access = "read", path = "./node_modules/@safe-global/safe-contracts/build/artifacts" }]

[fuzz]
runs = 256
